[project]
name = "jishatlas"
version = "0.1.0"
description = "JishAtlas is a simple file organization tool that uses AI to help clean up messy folders"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "google-genai>=2.14.0",
    "huggingface-hub>=1.26.0",
    "llama-cpp-python>=0.3.34",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "rich>=15.0.0",
]
