[project]
name = "jishatlas"
version = "0.1.0"
description = "JishAtlas is a simple file organization tool that uses AI to help clean up messy folders"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "google-genai>=2.14.0",
    "huggingface-hub>=1.26.0",
    "llama-cpp-python>=0.3.34",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "rich>=15.0.0",
]

[dependency-groups]
dev = [
    "pillow>=12.3.0",
    "pyinstaller>=6.22.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
